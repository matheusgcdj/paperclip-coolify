# Paperclip Stack for Coolify using official pre-built image
# Use this when deploying Paperclip as a Docker Compose service in Coolify.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-paperclip}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-paperclip}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-paperclip} -d ${POSTGRES_DB:-paperclip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - paperclip-network

  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    restart: unless-stopped
    pids_limit: 2048
    command: >-
      sh -c "node -e 'const fs=require(\"fs\"),p=\"/paperclip/instances/default/config.json\";if(!fs.existsSync(p)){fs.mkdirSync(\"/paperclip/instances/default\",{recursive:true});fs.writeFileSync(p,JSON.stringify({\"$$meta\":{version:1,updatedAt:new Date().toISOString(),source:\"configure\"},database:{mode:\"postgres\"},logging:{mode:\"file\",logDir:\"/paperclip/instances/default/logs\"},server:{deploymentMode:\"authenticated\",exposure:\"private\",bind:\"lan\",host:\"0.0.0.0\",port:3100,allowedHostnames:[],serveUi:true},auth:{baseUrlMode:\"auto\",disableSignUp:false},telemetry:{enabled:true},storage:{provider:\"local_disk\",localDisk:{baseDir:\"/paperclip/instances/default/data/storage\"}},secrets:{provider:\"local_encrypted\",strictMode:false,localEncrypted:{keyFilePath:\"/paperclip/instances/default/secrets/master.key\"}}}));console.log(\"Initialized default Paperclip instance config\");}for(const f of [\"/app/server/dist/routes/ai-connections.js\",\"/app/server/dist/adapters/codex-models.js\"]){if(fs.existsSync(f)){let c=fs.readFileSync(f,\"utf8\");if(c.includes(\"https://api.openai.com/v1/models\")){c=c.replace(/[\"\\\x27]https:\\/\\/api\\.openai\\.com\\/v1\\/models[\"\\\x27]/g,\"(process.env.OPENAI_BASE_URL?process.env.OPENAI_BASE_URL.replace(/\\\\/+$$/,\\\"\\\")+\\\"/models\\\":\\\"https://api.openai.com/v1/models\\\")\");fs.writeFileSync(f,c);console.log(\"Patched \"+f);}}}' && exec node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js"
    expose:
      - "3100"
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: "${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "${PAPERCLIP_DEPLOYMENT_EXPOSURE:-public}"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-${SERVICE_URL_PAPERCLIP:-http://localhost:3100}}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-${SERVICE_HEX_64_PAPERCLIP:-${SERVICE_PASSWORD_64_PAPERCLIP:-}}}"
      DATABASE_URL: "postgres://${SERVICE_USER_POSTGRES:-paperclip}:${SERVICE_PASSWORD_POSTGRES:-paperclip}@postgres:5432/${POSTGRES_DB:-paperclip}"

      # ── LLM Provider Keys & OpenAI-Compatible Endpoints ──
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MOONSHOT_API_KEY: "${MOONSHOT_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      OPENCODE_ALLOW_ALL_MODELS: "${OPENCODE_ALLOW_ALL_MODELS:-true}"
      GEMINI_SANDBOX: "${GEMINI_SANDBOX:-false}"

      # ── Optional Networking / Webhooks ──
      PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL: "${PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL:-}"
      PAPERCLIP_RUNNER_PUBLIC_URL: "${PAPERCLIP_RUNNER_PUBLIC_URL:-}"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - paperclip-network

volumes:
  pgdata:
  paperclip-data:

networks:
  paperclip-network:
    driver: bridge
